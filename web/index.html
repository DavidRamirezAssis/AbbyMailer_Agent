<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente de registro</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; background: #f7f7f8; color: #1f2328; }
      main { max-width: 720px; margin: 0 auto; }
      .estado { padding: 12px 16px; border-radius: 8px; background: #fff; border: 1px solid #d0d7de; }
    </style>
  </head>
  <body>
    <main>
      <h1>Asistente de registro como proveedor</h1>
      <p>Interfaz de chat en construcción.</p>
      <p class="estado" id="estado">Verificando el servicio...</p>
    </main>
    <script>
      fetch("/api/health")
        .then((r) => r.json())
        .then((d) => {
          document.getElementById("estado").textContent = d.ok
            ? `Servicio activo. Proveedor: ${d.provider}. Modelo: ${d.model}.`
            : "El servicio respondió con error."
        })
        .catch(() => {
          document.getElementById("estado").textContent = "No fue posible contactar el servicio."
        })
    </script>
  </body>
</html>
